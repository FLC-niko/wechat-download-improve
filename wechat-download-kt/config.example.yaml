# wechat-download-kt 配置文件
# 复制为 config.yaml 后使用

server:
  host: 0.0.0.0
  port: 5000
  site_url: http://localhost:5000

store:
  db_path: data/rss.db

auth:
  credentials_file: data/.credentials.json
  auto_recovery_enabled: false # 仅探测并告警；设为 true 才自动推送二维码恢复

rss:
  enabled: false             # MQ 采集服务默认关闭后台轮询，避免与任务争抢账号配额
  poll_interval: 3600        # 轮询间隔（秒）
  articles_per_poll: 10      # 每次轮询拉取文章数

# RabbitMQ 配置（与 we-mp-rss-kotlin Worker 保持一致）
rabbitmq:
  host: "localhost"
  port: 5672
  username: "guest"
  password: "guest"
  pro_virtual_host: "pro"
  test_virtual_host: "test"
  thdag_virtual_host: "thdag"
  reconnect_initial_delay_ms: 5000
  reconnect_max_delay_ms: 60000
  consumer_prefetch: 4       # 允许缓存命中任务越过单条慢 E-Ink 任务，E-Ink 请求仍按账号串行
  max_task_retry: 5          # 任务最大重试次数，超过进死信队列
  task_retry_delay_ms: 60000

notification:
  wecom_webhook_url: ""      # 企业微信群机器人 Webhook
  feishu_webhook_url: ""     # 飞书机器人 Webhook
  interval: 300              # 同一事件通知最小间隔（秒）

adapter:
  api_key: ""                # /api/v1/wx/* 适配壳鉴权密钥

weread:
  web_base_url: "https://weread.qq.com"
  account_dir: "data/weread_accounts"
  refresh_interval: 3000
  refresh_fail_threshold: 3
  auto_qr_notification_enabled: true # 失效后自动生成并通过机器人发送人工扫码二维码
  relogin_retry_backoff: 300   # Web 自动恢复失败后的最小重试间隔（秒）
  health_check_interval: 300   # Web 凭证健康检查间隔（秒）
  web_probe_freshness: 600     # /api/ready 认可最近一次成功探测的最长时间（秒）
  eink:
    enabled: true               # 真实 accessToken/refreshToken 续签通道，不依赖 ADB
    base_url: "https://i.weread.qq.com"
    credentials_file: "data/.weread_eink_credentials.json"
    sync_interval: 86400       # E-Ink 增量同步最小间隔（秒）
    page_size: 50
    max_pages: 1000
    refresh_check_interval: 60  # 只检查服务端明确返回的过期时间
    health_check_interval: 300  # 未知过期时间时，使用轻量文章请求主动探活
    human_verify_probe_interval: 3600 # -2041 后真实探测退避；期间任务直接走 Web/可信缓存
    refresh_skew: 300           # 已知到期时间前 5 分钟续签；未知时按 401/-2012 续签
    refresh_retry_initial: 30   # 临时刷新失败的首次退避（秒）
    refresh_retry_max: 900      # 临时刷新失败的最大退避（秒）
    sync_retry_backoff: 300     # 后台增量同步失败后的退避（秒）
    max_transient_retries: 2    # 单个 E-Ink 请求的临时错误重试次数
    retry_base_delay: 2         # 临时错误重试基础延迟（秒）
    max_concurrent_per_account: 1
    min_request_interval: 1     # 同一 E-Ink 账号请求最小间隔（秒）
    auto_qr_notification_enabled: true # refreshToken 失效后自动发送人工扫码二维码；-2041 除外
    relogin_retry_backoff: 300  # 自动二维码流程失败后的最小重试间隔（秒）

adb:
  enabled: false             # 当前上线版本不依赖 ADB；需要设备自动恢复时再显式开启
  poll_interval_ms: 15000
  recovery_max_delay_ms: 900000
  aaos_login_enabled: true   # 微信读书登录优先由 AAOS 无障碍链承接；false 回退服务端 ADB 坐标管线
  aaos_login_poll_timeout: 120 # AAOS 登录链的凭证等待超时（秒）

# 主微信接口返回 200013 后不会因降低频率而恢复，默认禁用。
wx:
  main:
    enabled: false
