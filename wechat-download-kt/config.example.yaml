# wechat-download-kt 配置文件
# 复制为 config.yaml 后使用

server:
  host: 0.0.0.0
  port: 5000
  # 必须填写通知接收者可访问的内网 VM 地址，不能使用 localhost
  site_url: "http://<内网VM地址>:5000"
  cors_allowed_origin: ""  # 仅配置可信前端来源；留空表示不允许跨域请求

store:
  db_path: data/rss.db

auth:
  credentials_file: data/.credentials.json

rss:
  poll_interval: 3600        # 轮询间隔（秒）
  articles_per_poll: 10      # 每次轮询拉取文章数

# RabbitMQ 配置（与 we-mp-rss-kotlin Worker 保持一致）
rabbitmq:
  host: "localhost"
  port: 5672
  username: "guest"
  password: "guest"
  pro_virtual_host: "pro"
  test_virtual_host: "test"
  xdag_virtual_host: "xdag"
  thdag_virtual_host: "thdag"
  reconnect_initial_delay_ms: 5000
  reconnect_max_delay_ms: 60000
  max_task_retry: 5          # 任务最大重试次数，超过进死信队列
  task_retry_delay_ms: 60000

notification:
  wecom_webhook_url: ""      # 企业微信群机器人 Webhook
  feishu_webhook_url: ""     # 飞书机器人 Webhook
  interval: 300              # 同一事件通知最小间隔（秒）

adapter:
  api_key: ""                # /api/v1/wx/* 适配壳鉴权密钥

weread:
  web_base_url: "https://weread.qq.com"
  account_dir: "data/weread_accounts"
  refresh_interval: 3000
  refresh_fail_threshold: 3

adb:
  enabled: true
  poll_interval_ms: 15000
