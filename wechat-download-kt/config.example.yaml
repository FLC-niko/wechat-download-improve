# wechat-download-kt 配置文件
# 复制为 config.yaml 后使用

server:
  host: 0.0.0.0
  port: 5000
  site_url: http://localhost:5000

store:
  db_path: data/rss.db

auth:
  credentials_file: data/.credentials.json

rss:
  poll_interval: 3600        # 轮询间隔（秒）
  articles_per_poll: 10      # 每次轮询拉取文章数

notification:
  wecom_webhook_url: ""      # 企业微信群机器人 Webhook
  feishu_webhook_url: ""     # 飞书机器人 Webhook
  interval: 300              # 同一事件通知最小间隔（秒）

adapter:
  api_key: ""                # /api/v1/wx/* 适配壳鉴权密钥
